[project]
name = "music-store-workshop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kris Ramki", email = "kris.rk2442@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.9",
    "ipykernel>=7.3.0",
    "langchain>=1.3",
    "langchain-anthropic>=1.7.0",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
music-store-workshop = "music_store_workshop:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
